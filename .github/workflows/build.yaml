name: Build NativeJet

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The build scripts use their own caches under .cache/.
          cache: false

      - name: Build and sign the app bundle
        run: make build

      - name: Run tests and vet
        run: make check

      - name: Package the app bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: ditto -c -k --keepParent build/NativeJet.app "build/NativeJet-macos-$ARCH.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: build/NativeJet-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run Windows tests and vet
        run: |
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
      - name: Build Windows packages
        shell: bash
        run: |
          bash scripts/build-windows.sh amd64
          bash scripts/build-windows.sh arm64
      - name: Zip Windows packages
        run: |
          Compress-Archive -Path build/windows-amd64/* -DestinationPath build/NativeJet-windows-amd64.zip
          Compress-Archive -Path build/windows-arm64/* -DestinationPath build/NativeJet-windows-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          path: build/NativeJet-windows-amd64.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: build/NativeJet-windows-arm64.zip
          archive: false
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run Linux tests and vet
        run: |
          go test ./...
          go vet ./...
      - name: Build Linux package
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-linux.sh "$ARCH"
      - name: Install and smoke-test package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y "./build/NativeJet-linux-$ARCH.deb" xvfb xauth dbus-x11 xdotool libgl1-mesa-dri libglx-mesa0 libegl-mesa0
          systemd-analyze verify /usr/lib/systemd/system/dev.nativejet.helper.service
          dbus-run-session -- xvfb-run -a bash -seuo pipefail <<'BASH'
            scratch=$(mktemp -d)
            export XDG_CONFIG_HOME="$scratch/config" XDG_RUNTIME_DIR="$scratch/run"
            mkdir -m 700 "$XDG_RUNTIME_DIR"
            nativejet >"$scratch/app.log" 2>&1 &
            app=$!
            cleanup() {
              rc=$?
              if [ "$rc" -ne 0 ]; then cat "$scratch/app.log"; fi
              if [ -n "${socket:-}" ]; then nativejetctl -socket "$socket" service.shutdown >/dev/null || true; fi
              kill "$app" 2>/dev/null || true
              wait "$app" 2>/dev/null || true
              rm -rf "$scratch"
            }
            trap cleanup EXIT
            for i in $(seq 1 100); do
              socket=$(find "$XDG_RUNTIME_DIR" -type s -path "*/nativejet/*.sock" -print -quit)
              if [ -n "$socket" ] && xdotool search --onlyvisible --name "^NativeJet$" >/dev/null &&
                  nativejetctl -socket "$socket" snapshot >"$scratch/snapshot.json"; then
                python3 -c "import json,sys; assert json.load(sys.stdin)[\"status\"][\"privileged\"] is False" <"$scratch/snapshot.json"
                exit 0
              fi
              kill -0 "$app"
              sleep 0.2
            done
            exit 1
          BASH
      - uses: actions/upload-artifact@v7
        with:
          path: build/NativeJet-linux-${{ matrix.arch }}.deb
          archive: false
          if-no-files-found: error
